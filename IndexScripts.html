<script>(()=>{const root=document.getElementById('classroom'),aula=(root.dataset.aula||'').toUpperCase(),map=document.getElementById('roomMap'),form=document.getElementById('incidentForm'),msg=document.getElementById('pageMessage'),submit=document.getElementById('submitBtn');let selected=null,boot=null;const $=s=>document.querySelector(s);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function showMessage(text,error){msg.textContent=text;msg.classList.remove('hidden','error');if(error)msg.classList.add('error')}function fail(e){showMessage(e?.message||String(e),true)}function load(){if(!aula){fail('Falta el código de aula.');return}google.script.run.withSuccessHandler(render).withFailureHandler(fail).apiBootstrap(aula)}function render(data){if(!data.ok){fail(data.message);return}boot=data;$('#roomTitle').textContent=`${data.aula.CODIGO} · ${data.aula.NOMBRE}`;$('#category').innerHTML='<option value="">Selecciona…</option>'+data.categories.map(c=>`<option>${esc(c)}</option>`).join('');$('#priority').innerHTML=data.priorities.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');map.innerHTML='';data.assets.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='asset'+(a.incidencias.length?' has-incident':'');b.dataset.type=a.tipo;b.style.left=a.x+'%';b.style.top=a.y+'%';b.style.width=a.w+'%';b.style.height=a.h+'%';b.style.transform=`rotate(${a.rotacion||0}deg)`;b.innerHTML=`${esc(a.nombre)}${a.incidencias.length?`<br>${a.incidencias.length} abierta${a.incidencias.length===1?'':'s'}`:''}`;b.setAttribute('aria-label',`${a.nombre}. ${a.incidencias.length} incidencias abiertas`);b.onclick=()=>choose(a);map.appendChild(b)})}function choose(a){selected={codigo:a.codigo,tipo:a.tipo,nombre:a.nombre};$('#selected').textContent=`${a.nombre} · ${a.codigo}`;submit.disabled=false;msg.classList.add('hidden')}$('#generalBtn').onclick=()=>{selected={codigo:'AULA',tipo:'GENERAL',nombre:'Incidencia general'};$('#selected').textContent='Incidencia general del aula';submit.disabled=false;msg.classList.add('hidden')};form.onsubmit=e=>{e.preventDefault();if(!selected)return;submit.disabled=true;showMessage('Registrando incidencia…',false);google.script.run.withSuccessHandler(r=>{showMessage(`Incidencia ${r.id} registrada correctamente.`,false);form.reset();selected=null;$('#selected').textContent='Selecciona un activo';load()}).withFailureHandler(e=>{submit.disabled=false;fail(e)}).apiCreateIncident({aula,activo:selected.codigo,tipoActivo:selected.tipo,categoria:$('#category').value,prioridad:$('#priority').value,descripcion:$('#description').value})};load()})();</script>
