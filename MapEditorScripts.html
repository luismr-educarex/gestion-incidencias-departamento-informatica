<script>(()=>{const root=document.getElementById('editor'),aula=(root.dataset.aula||'').toUpperCase(),map=document.getElementById('editorMap'),msg=document.getElementById('editorMsg');let assets=[],selected=null,drag=null;const $=s=>document.querySelector(s),clamp=(n,a,b)=>Math.max(a,Math.min(b,Number(n)||0));function load(){msg.textContent='Cargando…';google.script.run.withSuccessHandler(init).withFailureHandler(fail).apiEditorBootstrap(aula)}function fail(e){msg.textContent=e?.message||String(e)}function init(data){assets=data.assets.map(a=>({...a}));$('#editorTitle').textContent='Editor · '+(data.aula.NOMBRE||aula);msg.textContent='';render()}function render(){map.innerHTML='';assets.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='asset';b.textContent=a.nombre;b.dataset.code=a.codigo;paint(b,a);b.addEventListener('click',()=>select(a,b));b.addEventListener('pointerdown',e=>startDrag(e,a,b));map.appendChild(b)})}function paint(el,a){el.style.left=a.x+'%';el.style.top=a.y+'%';el.style.width=a.w+'%';el.style.height=a.h+'%';el.style.transform=`rotate(${a.rotacion||0}deg)`}function select(a,b){selected=a;map.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#selectedLabel').textContent=a.nombre+' · '+a.codigo;$('#controls').classList.remove('hidden');sync()}function sync(){if(!selected)return;$('#x').value=selected.x;$('#y').value=selected.y;$('#w').value=selected.w;$('#h').value=selected.h;$('#rot').value=selected.rotacion||0}function startDrag(e,a,b){if(e.button!==0)return;select(a,b);const rect=map.getBoundingClientRect();drag={a,b,rect,dx:e.clientX-(rect.left+rect.width*a.x/100),dy:e.clientY-(rect.top+rect.height*a.y/100)};b.setPointerCapture(e.pointerId);b.classList.add('dragging');b.addEventListener('pointermove',move);b.addEventListener('pointerup',end,{once:true})}function move(e){if(!drag)return;drag.a.x=clamp((e.clientX-drag.rect.left-drag.dx)/drag.rect.width*100,0,95);drag.a.y=clamp((e.clientY-drag.rect.top-drag.dy)/drag.rect.height*100,0,95);paint(drag.b,drag.a);sync()}function end(){if(!drag)return;drag.b.classList.remove('dragging');drag.b.removeEventListener('pointermove',move);drag=null}[['#x','x',0,95],['#y','y',0,95],['#w','w',3,40],['#h','h',3,25],['#rot','rotacion',-180,180]].forEach(([id,key,min,max])=>$(id).addEventListener('input',e=>{if(!selected)return;selected[key]=clamp(e.target.value,min,max);paint(map.querySelector(`[data-code="${selected.codigo}"]`),selected)}));$('#saveBtn').addEventListener('click',()=>{msg.textContent='Guardando…';$('#saveBtn').disabled=true;google.script.run.withSuccessHandler(r=>{$('#saveBtn').disabled=false;msg.textContent=`Mapa guardado: ${r.changed} elementos actualizados.`}).withFailureHandler(e=>{$('#saveBtn').disabled=false;fail(e)}).apiSaveMapLayout(aula,assets)});$('#reloadBtn').addEventListener('click',load);if(!aula)fail('Usa ?modo=editor&aula=A01');else load()})();</script>
