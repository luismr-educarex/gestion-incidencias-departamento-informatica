<script>(()=>{const root=document.getElementById('editor'),aula=(root.dataset.aula||'').toUpperCase(),map=document.getElementById('editorMap'),msg=document.getElementById('editorMsg'),saveBtn=document.getElementById('saveBtn');let assets=[],selected=null,drag=null,dirty=false;const $=s=>document.querySelector(s),round=n=>Math.round(n*2)/2,precise=n=>Math.round(n*100)/100,clamp=(n,a,b)=>Math.max(a,Math.min(b,Number(n)||0));function normalize(a){a.w=clamp(a.w,3,40);a.h=clamp(a.h,3,25);a.x=clamp(a.x,0,100-a.w);a.y=clamp(a.y,0,100-a.h);a.rotacion=clamp(a.rotacion,-180,180);return a}function setDirty(value){dirty=value;saveBtn.disabled=!value;if(value)msg.textContent='Hay cambios sin guardar.'}function load(){msg.textContent='Cargando…';saveBtn.disabled=true;google.script.run.withSuccessHandler(init).withFailureHandler(fail).apiEditorBootstrap(aula)}function fail(e){msg.textContent=e?.message||String(e)}function init(data){assets=data.assets.map(a=>normalize({...a}));selected=null;dirty=false;saveBtn.disabled=true;$('#controls').classList.add('hidden');$('#selectedLabel').textContent='Selecciona un elemento';$('#editorTitle').textContent='Editor · '+(data.aula.NOMBRE||aula);msg.textContent='';render()}function render(){map.innerHTML='';assets.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='asset';b.textContent=a.nombre;b.dataset.code=a.codigo;b.dataset.type=a.tipo;b.setAttribute('aria-label',a.nombre+'. Arrastra para mover o usa las teclas de dirección.');paint(b,a);b.addEventListener('click',()=>select(a,b));b.addEventListener('pointerdown',e=>startDrag(e,a,b));b.addEventListener('keydown',e=>moveWithKeyboard(e,a,b));map.appendChild(b)})}function paint(el,a){normalize(a);el.style.left=a.x+'%';el.style.top=a.y+'%';el.style.width=a.w+'%';el.style.height=a.h+'%';el.style.transform=`rotate(${a.rotacion||0}deg)`}function select(a,b){selected=a;map.querySelectorAll('.selected').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-p ach(([id,key,min,max])=>$(id).addEventListener('input',e=>{if(!selected)return;selected[key]=clamp(e.target.value,min,max);changed(selected,map.querySelector(`[data-code="${selected.codigo}"]`))}));saveBtn.addEventListener('click',()=>{msg.textContent='Guardando…';saveBtn.disabled=true;google.script.run.withSuccessHandler(r=>{dirty=false;saveBtn.disabled=true;msg.textContent=`Mapa guardado: ${r.changed} elementos actualizados.`}).withFailureHandler(e=>{saveBtn.disabled=false;fail(e)}).apiSaveMapLayout(aula,assets.map(a=>({codigo:a.codigo,x:a.x,y:a.y,w:a.w,h:a.h,rotacion:a.rotacion})))});$('#reloadBtn').addEventListener('click',load);window.addEventListener('beforeunload',e=>{if(!dirty)return;e.preventDefault();e.returnValue=''});if(!aula)fail('Usa ?modo=editor&aula=A01');else load()})();</script>
