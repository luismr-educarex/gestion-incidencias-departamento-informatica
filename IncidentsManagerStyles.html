<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1100px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:.2rem 0 1rem}.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#667085;font-weight:800}.back{color:#1d4ed8;font-weight:700}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#fff;border:1px solid #d8dee8;border-radius:16px;padding:12px;margin-bottom:12px}select,button,textarea{font:inherit;min-height:44px;border-radius:10px;border:1px solid #d8dee8;padding:8px;background:#fff}button{background:#1d4ed8;color:#fff;border:0;font-weight:700}.secondary{background:#fff;color:#172033;border:1px solid #d8dee8}.filters label{display:flex;align-items:center;gap:6px;font-size:.85rem}.list{display:grid;gap:9px}.incident{background:#fff;border:1px solid #d8dee8;border-radius:15px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px}.incident h3{margin:0 0 4px}.meta,.muted{font-size:.82rem;color:#667085}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:.75rem;border:1px solid #d8dee8;border-radius:999px;padding:4px 7px}.urgent{color:#a51d1d;border-color:#e6a5a5}.error{padding:10px;background:#fff4f4;border:1px solid #e6a5a5;border-radius:10px}.hidden{display:none}dialog{width:min(720px,calc(100% - 24px));border:1px solid #d8dee8;border-radius:18px;padding:18px}dialog::backdrop{background:rgba(0,0,0,.35)}.history{border-left:2px solid #d8dee8;padding-left:12px;margin:14px 0}.history-item{margin:0 0 10px}.workflow{display:grid;gap:9px;margin:14px 0}.workflow textarea{width:100%}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.incident{grid-template-columns:1fr}.incident button{width:100%}}</style>
