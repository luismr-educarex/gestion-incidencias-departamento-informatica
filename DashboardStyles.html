<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1050px;margin:auto;padding:18px}header,.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:.2rem 0 1rem}h2{font-size:1.1rem}.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#667085;font-weight:800}button,a.action{min-height:44px;border:0;border-radius:11px;background:#1d4ed8;color:#fff;padding:0 14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 22px}.stat,.room{background:#fff;border:1px solid #d8dee8;border-radius:16px;padding:14px}.stat strong{font-size:1.65rem;display:block}.stat span,.muted{font-size:.82rem;color:#667085}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.room-head{display:flex;justify-content:space-between;gap:10px}.room h3{margin:0 0 4px}.counts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid #d8dee8;border-radius:999px;padding:5px 8px;font-size:.78rem}.urgent{border-color:#e6a5a5;color:#a51d1d}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{flex:1}.actions a.secondary{background:#fff;color:#172033;border:1px solid #d8dee8}.error{padding:12px;border:1px solid #e6a5a5;background:#fff4f4;border-radius:12px}.hidden{display:none}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.rooms{grid-template-columns:1fr}main{padding:12px}}</style>
