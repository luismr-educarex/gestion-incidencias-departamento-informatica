<style>
:root{--bg:#f5f7fa;--surface:#fff;--text:#172033;--muted:#667085;--line:#d8dee8;--primary:#1d4ed8;--danger:#b42318}
*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;min-width:0;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{width:100%;max-width:1120px;margin:auto;padding:16px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.topbar>*{min-width:0}.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}h1,h2{margin:.25rem 0;overflow-wrap:anywhere}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:.78rem;white-space:nowrap}.panel{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.muted{color:var(--muted);font-size:.86rem}.hidden{display:none!important}button,.action{min-width:0;min-height:44px;border:0;border-radius:11px;background:var(--primary);color:#fff;padding:0 14px;font:inherit;font-weight:700;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}button.secondary,.action.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}.room-map{position:relative;width:100%;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(90deg,rgba(29,78,216,.035) 1px,transparent 1px),linear-gradient(rgba(29,78,216,.035) 1px,transparent 1px),#fff;background-size:5% 5%}.asset{position:absolute;min-width:0;min-height:0;padding:2px 4px;border:2px solid #8ea5d9;border-radius:7px;background:#eaf0ff;color:#172033;font-size:clamp(.58rem,1.1vw,.78rem);line-height:1.1;overflow:hidden;transform-origin:center}.asset[data-type="PC_PROFESOR"]{background:#dcfce7;border-color:#4ade80}.asset[data-type="PROYECTOR"]{background:#fef3c7;border-color:#f59e0b}.asset.has-incident{background:#fee4e2;border-color:#f04438;color:#7a271a}.message{margin-top:10px;padding:10px 12px;
