<script>(()=>{const $=s=>document.querySelector(s);function load(){$('#error').classList.add('hidden');google.script.run.withSuccessHandler(render).withFailureHandler(fail).apiDashboard()}function fail(e){$('#error').textContent=e?.message||String(e);$('#error').classList.remove('hidden')}function render(d){const s=d.summary;$('#stats').innerHTML=[['Abiertas',s.abiertas],['Urgentes',s.urgentes],['En proceso',s.enProceso],['Registradas hoy',s.hoy]].map(([l,v])=>`<article class="stat"><strong>${v}</strong><span>${l}</span></article>`).join('');$('#roomCount').textContent=`${d.rooms.length} aulas`;$('#rooms').innerHTML=d.rooms.map(r=>`<article class="room"><div class="room-head"><div><h3>${esc(r.codigo)} · ${esc(r.nombre)}</h3><div class="muted">Estado operativo del aula</div></div></div><div class="counts"><span class="pill">${r.abiertas} abiertas</span>${r.urgentes?`<span class="pill urgent">${r.urgentes} urgentes</span>`:''}<span class="pill">${r.enProceso} en proceso</span></div><div class="actions"><a class="action" href="?aula=${encodeURIComponent(r.codigo)}">Abrir mapa</a><a class="action secondary" href="?modo=editor&aula=${encodeURIComponent(r.codigo)}">Editar mapa</a></div></article>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('#refresh').addEventListener('click',load);load()})();</script>
