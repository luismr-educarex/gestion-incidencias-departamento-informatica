<script>(()=>{const $=s=>document.querySelector(s),list=$('#list'),dlg=$('#detail');let boot;function fail(e){$('#error').textContent=e?.message||String(e);$('#error').classList.remove('hidden')}function start(){google.script.run.withSuccessHandler(b=>{boot=b;fill();load()}).withFailureHandler(fail).apiManagerBootstrap()}function fill(){boot.aulas.forEach(a=>$('#aula').add(new Option(`${a.codigo} · ${a.nombre}`,a.codigo)));boot.states.forEach(s=>$('#estado').add(new Option(pretty(s),s)));boot.priorities.forEach(p=>$('#prioridad').add(new Option(pretty(p),p)))}function load(){const f={aula:$('#aula').value,estado:$('#estado').value,prioridad:$('#prioridad').value,abiertas:$('#abiertas').checked};google.script.run.withSuccessHandler(render).withFailureHandler(fail).apiListIncidents(f)}function render(d){list.innerHTML=d.incidents.length?d.incidents.map(i=>`<article class="incident"><div><h3>${esc(i.id)} · ${esc(i.aula)} · ${esc(i.activo)}</h3><div class="meta">${esc(i.fecha)} · ${esc(i.categoria)}</div><p>${esc(i.descripcion)}</p><div class="tags"><span class="tag ${i.prioridad==='URGENTE'?'urgent':''}">${pretty(i.prioridad)}</span><span class="tag">${pretty(i.estado)}</span>${i.responsable?`<span class="tag">${esc(i.responsable)}</span>`:''}</div></div><button type="button" data-id="${esc(i.id)}">Gestionar</button></article>`).join(''):'<p class="muted">No hay incidencias con estos filtros.</p>'}function open(id){google.script.run.withSuccessHandler(show).withFailureHandler(fail).apiGetIncident(id)}function show(d){const i=d.incident;$('#detailBody').innerHTML=`<div class="eyebrow">${esc(i.ID)}</div><h2>${esc(i.AULA)} · ${esc(i.ACTIVO)}</h2><p>${esc(i.DESCRIPCION)}</p><div class="tags"><span class="tag">${pretty(i.ESTADO)}</span><span class="tag ${i.PRIORIDAD==='URGENTE'?'urgent':''}">${pretty(i.PRIORIDAD)}</span></div><div class="workflow">${i.ESTADO==='NUEVA'?`<select id="responsable"><option value="">Seleccionar responsable…</option>${boot.users.map(u=>`<option value="${esc(u.email)}">${esc(u.nombre)}</option>`).join('')}</select><button id="assign">Asignar</button>`:''}${d.allowedNext.includes('EN_PROCESO')?'<button id="progress">Marcar en proceso</button>':''}${d.allowedNext.includes('RESUELTA')?'<textarea id="solution" rows="3" placeholder="Solución aplicada"></textarea><button id="resolve">Resolver incidencia</button>':''}${d.allowedNext.includes('CERRADA')?'<button id="close">Cerrar incidencia</button>':''}</div><h3>Historial</h3><div class="history">${d.history.map(h=>`<div class="history-item"><strong>${esc(h.FECHA)}</strong><div>${esc(h.USUARIO||'Sistema')} · ${pretty(h.ESTADO_ANTERIOR||'')} ${h.ESTADO_NUEVO?'→ '+pretty(h.ESTADO_NUEVO):''}</div><div class="muted">${esc(h.OBSERVACION||'')}</div></div>`).join('')}</div>`;wire(i.ID);dlg.showModal()}function wire(id){const a=$('#assign');if(a)a.onclick=()=>act('apiAssignIncident',[id,$('#responsable').value]);const p=$('#progress');if(p)p.onclick=()=>act('apiChangeIncidentState',[id,'EN_PROCESO','Inicio de trabajo']);const r=$('#resolve');if(r)r.onclick=()=>act('apiResolveIncident',[id,$('#solution').value]);const c=$('#close');if(c)c.onclick=()=>act('apiCloseIncident',[id,'Cierre validado'])}function act(fn,args){google.script.run.withSuccessHandler(()=>{dlg.close();load()}).withFailureHandler(fail)[fn](...args)}function pretty(v){return String(v||'').toLowerCase().replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase())}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('#apply').onclick=load;list.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)open(b.dataset.id)});start()})();</script>
